name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
        # organization-owned repos; run the free, open-source CLI directly
        # instead so this gate doesn't depend on a purchased license.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner -v
          # Remove the downloaded binary/archive so the next step's grep-based
          # scan doesn't match raw byte patterns inside the compiled binary.
          # (Only the "gitleaks" member is extracted above, so these are the
          # only two files this step adds to the workspace.)
          rm -f gitleaks gitleaks.tar.gz
      - name: generic leak patterns
        run: sh ci/leak-scan.sh .
      - name: structure check
        run: sh ci/structure-check.sh .
      - name: install jq
        # The audit/correlation/cost/redaction libraries and their test suites
        # parse JSON with jq; the runner needs it available.
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: run test suites
        # Executes every tests/*.sh and skills/*/tests/*.sh under /bin/sh and
        # fails the build on any failure. Also rejects dead bats-syntax tests
        # that cannot run under POSIX sh (the class that hid live bugs through
        # eight releases). This is the step that actually exercises the code.
        run: sh ci/run-tests.sh .
      - name: install Claude Code
        # Earliest version whose plugin validator supports --strict.
        run: npm install --global @anthropic-ai/claude-code@2.1.145
      - name: strict plugin validation
        run: claude plugin validate . --strict
