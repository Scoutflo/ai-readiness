name: ci
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
        # organization-owned repos; run the free, open-source CLI directly
        # instead so this gate doesn't depend on a purchased license.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner -v
          # Remove the downloaded binary/archive so the next step's grep-based
          # scan doesn't match raw byte patterns inside the compiled binary.
          # (Only the "gitleaks" member is extracted above, so these are the
          # only two files this step adds to the workspace.)
          rm -f gitleaks gitleaks.tar.gz
      - name: generic leak patterns
        run: sh ci/leak-scan.sh .
      - name: structure check
        run: sh ci/structure-check.sh .
      - name: install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.217
      - name: strict plugin validation
        run: claude plugin validate . --strict
